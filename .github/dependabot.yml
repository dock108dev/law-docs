version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # onnxruntime 1.30.0 has no Python 3.15 PyPI wheels; keep 3.14.x until it does.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
