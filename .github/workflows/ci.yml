name: CI and deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    name: Browser and frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci && npm run check && npx prettier --check web tests/web tests/browser "*config.js" package.json && npm test && npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Serve static design for browser tests
        run: |
          mkdir -p /tmp/lawdocs-web/assets
          cp web/index.html /tmp/lawdocs-web/
          cp web/*.js web/*.css /tmp/lawdocs-web/assets/
          python3 -m http.server 8795 --directory /tmp/lawdocs-web > /tmp/web.log 2>&1 &
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: |
            coverage/
            test-results/
            playwright-report/
          retention-days: 3
  linux:
    name: Python, fresh install, rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build test runtime from pinned dependencies
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: test
          load: true
          tags: lawdocs-test
          cache-from: type=gha,scope=lawdocs
          cache-to: type=gha,scope=lawdocs,mode=max
      - name: Unit coverage, formatting, integration and dependency audit
        run: |
          mkdir -p reports
          docker run --rm --network host -v "$PWD/reports:/reports" lawdocs-test sh -ec '
            ruff check server.py delivery.py retention.py worker.py engines/crash_report/scripts engines/plea_reports/app tests scripts deploy
            ruff format --check server.py delivery.py retention.py worker.py engines/crash_report/scripts engines/plea_reports/app tests scripts deploy
            python -m pytest --cov --cov-report=json:/reports/coverage.json --cov-report=xml:/reports/coverage.xml
            python scripts/coverage_gate.py /reports/coverage.json
            python -m unittest discover -s tests -p test_integration.py
            python -m pytest tests/integration
            pip-audit --disable-pip --no-deps -r deploy/requirements.lock
          '
      - name: Build the production artifact once
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: runtime
          load: true
          tags: lawdocs:${{ github.sha }}
          cache-from: type=gha,scope=lawdocs
      - name: Package release
        run: |
          docker save lawdocs:${{ github.sha }} | gzip > release.tar.gz
          sha256sum release.tar.gz > release.sha256
      - name: Clean host install and failed-release rollback
        run: |
          sudo bash deploy/bootstrap.sh http://127.0.0.1:8888
          sudo cp release.tar.gz /opt/lawdocs/incoming/${{ github.sha }}.tar.gz
          sudo /usr/local/sbin/lawdocs-release '${{ github.sha }}' "$(cut -d ' ' -f1 release.sha256)"
          python3 scripts/check_rollback.py '${{ github.sha }}'
          curl --fail http://127.0.0.1:8888/api/health
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-evidence
          path: reports/
          retention-days: 3
  mac:
    name: macOS OCR adapter
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - run: python -m pip install Pillow==12.3.0 pyobjc-framework-Vision==12.2 pyobjc-framework-Quartz==12.2
      - run: python scripts/check_apple.py
  deploy:
    name: Deploy production
    needs: [web, linux, mac]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: lawdocs-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
      - name: Deploy tested artifact
        env:
          DEPLOY_KEY: ${{ secrets.HETZNER_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.HETZNER_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          sha256sum -c release.sha256
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes lawdocs-deploy@"$DEPLOY_HOST" "deploy ${{ github.sha }} $(cut -d ' ' -f1 release.sha256)" < release.tar.gz
      - name: Verify public release
        run: |
          curl --fail --retry 3 https://lawdocs.dock108.dev/api/health > health.json
          python3 -c 'import json; r=json.load(open("health.json")); assert r["release"]=="${{ github.sha }}"; assert r["retention_hours"]==48'
